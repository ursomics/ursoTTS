name: test
on: [push, pull_request]
jobs:
  dummy-pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: pip install -e .
      - run: ursotts preview scripts/02_intro_ko.txt
      - run: ursotts batch scripts output --engine dummy
      - run: test -f output/01_intro_en.srt && test -f output/02_intro_ko.mp3
